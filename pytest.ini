# pytest.ini
[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    unit: Pure unit tests, no external dependencies
    integration: Integration tests with in-memory DB, mocked APIs
    e2e: End-to-end tests requiring real API keys and Docker (slow)
